function askRealMilo(message){
  var stars = 0; try{ stars = JSON.parse(localStorage.getItem('littleminds_data')||'{}').stars || 0; }catch(e){}
  return fetch('/api/milo', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, system: MILO_SYSTEM_PROMPT, context: { stars: stars } })

  }).then(function(d){ 
    return d.reply || "Let's learn! 🌟";

  });
}
