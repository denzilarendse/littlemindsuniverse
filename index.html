/* ============ VOICE SYSTEM ============ */
var voiceEnabled = true; var synth = window.speechSynthesis; var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function cleanForSpeech(t){ return t.replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g," ").replace(/[\u2600-\u27BF]/g," ").trim(); }
function speak(text){ if(!voiceEnabled||!synth) return; synth.cancel(); var u=new SpeechSynthesisUtterance(cleanForSpeech(text)); u.rate=0.95; u.pitch=1.1; synth.speak(u); }
function toggleVoice(){ voiceEnabled=!voiceEnabled; if(!voiceEnabled&&synth){synth.cancel();} document.getElementById("voice-toggle").innerHTML=voiceEnabled?"🔊":""; }
function startListening(){
  if(!SpeechRec){ alert("Voice listening needs Chrome browser 🎙️"); return; }
  var mic=document.getElementById("mic-btn");
  function begin(){
    try{
      var rec=new SpeechRec(); rec.lang="en-US"; rec.continuous=false; rec.interimResults=false;
      mic.classList.add("listening");
      rec.onresult=function(e){ mic.classList.remove("listening"); document.getElementById("milo-input").value=e.results[0][0].transcript; sendToMilo(); };
      rec.onerror=function(e){ mic.classList.remove("listening"); var err=(e&&e.error)?e.error:"unknown";
        if(err==="no-speech"){ alert("Milo didn't hear anything 👂 Tap ️ and speak clearly!"); }
        else if(err==="not-allowed"||err==="service-not-allowed"){ alert("Microphone is blocked 🔒\n\nFix: Chrome ⋮ → Settings → Site settings → Microphone → allow this site."); }
        else if(err==="network"){ alert("Voice needs internet 🌐 Check your data and try again."); }
        else if(err==="aborted"){ }
        else{ alert("Milo couldn't hear you ("+err+"). Try again! 🎙️"); } };
      rec.onend=function(){ mic.classList.remove("listening"); };
      rec.start();
    }catch(err){ mic.classList.remove("listening"); alert("Voice failed to start. Try again! 🎙️"); }
  }
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ stream.getTracks().forEach(function(t){t.stop();}); begin(); })
    .catch(function(){ alert("Microphone permission needed 🔒\n\nWhen Chrome asks, tap ALLOW, then press 🎙️ again."); });
  } else { begin(); }
}

var StorageService = {
  saveUser:function(u){ localStorage.setItem("lmu_user", JSON.stringify(u)); },
  getUser:function(){ var d=localStorage.getItem("lmu_user"); return d?JSON.parse(d):null; },
  clearUser:function(){ localStorage.removeItem("lmu_user"); },
  getProgress:function(){
    var d=localStorage.getItem("lmu_progress");
    var p=d?JSON.parse(d):{stars:0,activitiesCompleted:0};
    if(!p.skills){ p.skills={}; }
    var keys=["math","science","reading","coding","creativity","social"];
    for(var i=0;i<keys.length;i++){ if(typeof p.skills[keys[i]]==="undefined"){ p.skills[keys[i]]=0; } }
    if(!p.stages){ p.stages={}; }
    var isl=["foundation","discovery","creator"];
    for(var j=0;j<isl.length;j++){ if(typeof p.stages[isl[j]]==="undefined"){ p.stages[isl[j]]=1; } }
    return p;
  },
  saveProgress:function(p){ localStorage.setItem("lmu_progress", JSON.stringify(p)); },
  addStars:function(n){ var p=this.getProgress(); p.stars+=n; this.saveProgress(p); return p.stars; },
  addSkill:function(s){ var p=this.getProgress(); p.skills[s]=(p.skills[s]||0)+1; this.saveProgress(p); },
  completeActivity:function(){ var p=this.getProgress(); p.activitiesCompleted++; this.saveProgress(p); },
  getStage:function(island){ var p=this.getProgress(); return p.stages[island]||1; },
  unlockStage:function(island){ var p=this.getProgress(); if((p.stages[island]||1)<6){ p.stages[island]=(p.stages[island]||1)+1; this.saveProgress(p);} return p.stages[island]; },
  getAchievements:function(){ var d=localStorage.getItem("lmu_achievements"); return d?JSON.parse(d):[]; },
  addAchievement:function(a){ var list=this.getAchievements(); if(list.indexOf(a)===-1){ list.push(a); localStorage.setItem("lmu_achievements", JSON.stringify(list)); } },
  getSubscription:function(){ var d=localStorage.getItem("lmu_subscription"); return d?JSON.parse(d):{plan:"free",active:false}; },
  setSubscription:function(plan){ var sub={plan:plan,active:true,startDate:new Date().toISOString()}; localStorage.setItem("lmu_subscription", JSON.stringify(sub)); return sub; },

var AuthService = {
  getAllUsers:function(){ var d=localStorage.getItem("lmu_users"); return d?JSON.parse(d):[]; },
  register:function(name,email,password,role){
    var users=this.getAllUsers();
    for(var i=0;i<users.length;i++){ if(users[i].email===email){ return {success:false,message:"Account already exists! Try logging in."}; } }
    var u={id:Date.now(),name:name,email:email,password:password,role:role||"parent"};
    users.push(u); localStorage.setItem("lmu_users", JSON.stringify(users));
    return {success:true,message:"Welcome to LittleMindsUniverse! 🌟"};
  },
  login:function(email,password){
    var users=this.getAllUsers();
    for(var i=0;i<users.length;i++){ if(users[i].email===email && users[i].password===password){ StorageService.saveUser(users[i]); return {success:true,message:"Welcome back, "+users[i].name+"! 🦉"}; } }
    return {success:false,message:"Invalid email or password ❌"};
  },
  logout:function(){ StorageService.clearUser(); },
  isLoggedIn:function(){ return StorageService.getUser()!==null; },
  getCurrentUser:function(){ return StorageService.getUser(); }
};

    if(msg.indexOf("who are you")>-1||msg.indexOf("your name")>-1){ return "I'm Milo! Your friendly AI learning companion, teaching with the South African CAPS curriculum! 🇿"; }
    return this.pick(["Great question! Let's explore that together step by step!","Ooh, I love your curiosity! Tell me more!"]);

function startWeek(island, month, week){
  if(month>1 && !StorageService.isPremium()){ App.showPage("subscribe"); return; }
  currentQuiz={island:island, month:month, week:week, index:0, score:0, done:false, skills:{}, mistakes:{}};
  App.showPage("quiz");
}
function monthComplete(island, month){
  var weeks=CURRICULUM[island].months[month-1].weeks;
  for(var w=1;w<=weeks.length;w++){ if(!StorageService.weekPassed(island+"-"+month+"-"+w)) return false; }
  return true;
}
function answerQuiz(i){
  if(!currentQuiz||currentQuiz.done) return;
  var weekData=CURRICULUM[currentQuiz.island].months[currentQuiz.month-1].weeks[currentQuiz.week-1];
  var q=weekData.questions[currentQuiz.index];
  if(i===q.answer){
    currentQuiz.score++;
    StorageService.addStars(10);
    StorageService.addSkill(q.subject);
    currentQuiz.skills[q.subject]=(currentQuiz.skills[q.subject]||0)+1;
  } else {
    currentQuiz.mistakes[q.subject]=(currentQuiz.mistakes[q.subject]||0)+1;
  }
  currentQuiz.index++;
  if(currentQuiz.index>=weekData.questions.length){
    var passed=currentQuiz.score>=3;
    var key=currentQuiz.island+"-"+currentQuiz.month+"-"+currentQuiz.week;
    StorageService.saveReport(key,{ theme:weekData.theme, island:currentQuiz.island, month:currentQuiz.month, week:currentQuiz.week, correct:currentQuiz.score, total:weekData.questions.length, skills:currentQuiz.skills, mistakes:currentQuiz.mistakes, date:Date.now() });
    if(passed){
      StorageService.addStars(20);
      StorageService.passWeek(key);
      StorageService.completeActivity();
      if(monthComplete(currentQuiz.island,currentQuiz.month)){
        StorageService.addAchievement(CURRICULUM[currentQuiz.island].months[currentQuiz.month-1].badge);
        if(currentQuiz.month<6){ StorageService.unlockStage(currentQuiz.island); }
      }
    }
    currentQuiz.done=true;
    speak(passed ? "Week complete! Great work, Explorer!" : "Good try! Let's practise again!");
  }
  App.showPage("quiz");
}

    '<div class="island-card discovery"><div class="island-icon">'+d.icon+'</div><h3>'+d.name+'</h3><span class="badge badge-green">Ages '+d.ages+' • Gr 1-3</span>'+monthButtons('discovery')+'</div>'+
    '<div class="island-card creator"><div class="island-icon">'+c.icon+'</div><h3>'+c.name+'</h3><span class="badge badge-purple">Ages '+c.ages+' • Gr 4-6</span>'+monthButtons('creator')+'</div></div>';
  },
  renderMonthView:function(){
    if(!currentMonth){ return this.renderIslands(); }
    var data=CURRICULUM[currentMonth.island];
    var m=data.months[currentMonth.month-1];
    if(!m.weeks.length){
      return '<div class="quiz-card" style="text-align:center"><div class="result-emoji">📦</div><h2 style="color:#0284c7">New Adventures Coming Soon!</h2><p>This month\'s CAPS content arrives in the next content drop.</p><button class="hero-btn" onclick="navigate(\'islands\')">Back to Islands 🏝️</button></div>';
    }
    var html='<h2 class="section-title">'+data.title+' — '+m.name+'</h2><span class="caps-tag">🇿🇦 CAPS: '+m.caps+'</span>';
    for(var w=0;w<m.weeks.length;w++){
      var wk=m.weeks[w]; var key=currentMonth.island+"-"+currentMonth.month+"-"+(w+1);
      var passed=StorageService.weekPassed(key);
      var unlocked=(w===0)||StorageService.weekPassed(currentMonth.island+"-"+currentMonth.month+"-"+w);
      html+='<div class="quiz-card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-size:14px"><strong>Week '+(w+1)+':</strong> '+wk.theme+'</div>'+
      (passed?'<span class="badge badge-green">✅ Done</span>': unlocked?'<button class="island-btn" onclick="startWeek(\''+currentMonth.island+'\','+currentMonth.month+','+(w+1)+')">Play ▶️</button>':'<span class="badge badge-yellow">🔒 Finish previous week</span>')+
      '</div></div>';
    }
    html+='<div style="text-align:center"><button class="hero-btn" onclick="navigate(\'islands\')">Back 🏝️</button></div>';
    return html;
  },
  renderQuiz:function(){
    if(!currentQuiz){ return this.renderIslands(); }
    var data=CURRICULUM[currentQuiz.island];
    var weekData=data.months[currentQuiz.month-1].weeks[currentQuiz.week-1];
    if(currentQuiz.done){
      var total=weekData.questions.length;
      var passed=currentQuiz.score>=3;
      var perfect=currentQuiz.score===total;
      var earned=currentQuiz.score*10+(passed?20:0);
      var html='<div class="quiz-card" style="text-align:center">'+
      (perfect&&passed?'<div class="confetti"><span>🎉</span><span>🌟</span><span>🎊</span></div>':'<div class="result-emoji">'+(passed?'🎉':'')+'</div>')+
      '<h2 style="color:#0284c7">'+(passed?'Week Complete!':'Keep Trying!')+'</h2>'+
      '<p>'+weekData.theme+' • '+currentQuiz.score+' / '+total+' correct</p>'+
      '<p style="font-size:20px;font-weight:bold;color:#92400e">+'+earned+' ⭐</p>';
      if(passed){
        html+='<div class="milo-feedback">🦉 Milo: "AMAZING! Your weekly report is ready for Mom/Dad! 📅"</div>';
        if(currentQuiz.week<4){
          html+='<button class="hero-btn" onclick="openMonth(\''+currentQuiz.island+'\','+currentQuiz.month+')">Next Week ➡️</button>';
        } else {
          html+='<div class="milo-feedback">🦉 Milo: "Month complete! You are a CAPS CHAMPION! 🏆🇦"</div>'+
          '<button class="hero-btn" onclick="navigate(\'islands\')">Islands 🏝️</button>';
        }
      } else {
        html+='<div class="milo-feedback">🦉 Milo: "Score 3/4 to complete this week. You can do it! 💪"</div>';
      }
      html+='<button class="hero-btn" onclick="startWeek(\''+currentQuiz.island+'\','+currentQuiz.month+','+currentQuiz.week+')">Play Again 🔄</button>'+
      '<button class="hero-btn" onclick="openMonth(\''+currentQuiz.island+'\','+currentQuiz.month+')">Weeks 📅</button></div>';
      return html;
    }
    var q=weekData.questions[currentQuiz.index];
    var html='<h2 class="section-title">'+weekData.theme+'</h2><div class="quiz-card">'+
    '<span class="caps-tag">🇿🇦 CAPS: '+data.months[currentQuiz.month-1].caps+' • '+data.months[currentQuiz.month-1].name+' Week '+currentQuiz.week+'</span>'+
    '<div class="quiz-progress"><span>Game '+(currentQuiz.index+1)+' / '+weekData.questions.length+'</span><span>Score: '+currentQuiz.score+' ✅</span></div>'+
    '<div class="quiz-q">'+q.q+'</div>';
    for(var i=0;i<q.options.length;i++){ html+='<button class="quiz-option" onclick="answerQuiz('+i+')">'+q.options[i]+'</button>'; }
    html+='</div><div class="milo-feedback">🦉 Milo: Take your time, Explorer! I believe in you! 💪</div>';
    return html;
  }
};
window.onload=function(){ Navbar.render(); App.showPage("home"); console.log("✅ LittleMindsUniverse v2.0 Ready — COMPLETE Single File! 🇿🇦"); };
