name: public-release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-release.yml'
      - 'android/**'
      - 'api/**'
      - 'assets/**'
      - 'netlify/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'connect.html'
      - 'manifest.json'
      - 'sw.js'
      - 'netlify.toml'
      - 'capacitor.config.json'
      - 'capacitor.connect.config.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-release.yml'
      - 'android/**'
      - 'api/**'
      - 'assets/**'
      - 'netlify/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'connect.html'
      - 'manifest.json'
      - 'sw.js'
      - 'netlify.toml'
      - 'capacitor.config.json'
      - 'capacitor.connect.config.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Explicit owner authorization to promote this verified candidate to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-package-deploy:
    runs-on: ubuntu-24.04
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      LMU_ANDROID_KEYSTORE_BASE64: ${{ secrets.LMU_ANDROID_KEYSTORE_BASE64 }}
      LMU_ANDROID_STORE_PASSWORD: ${{ secrets.LMU_ANDROID_STORE_PASSWORD }}
      LMU_ANDROID_KEY_ALIAS: ${{ secrets.LMU_ANDROID_KEY_ALIAS }}
      LMU_ANDROID_KEY_PASSWORD: ${{ secrets.LMU_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify web source and build production bundle
        run: npm run check

      - name: Sync Android production bundle
        run: npm run android:sync

      - name: Detect owner release-signing material
        id: signing
        shell: bash
        run: |
          if [ -n "$LMU_ANDROID_KEYSTORE_BASE64" ] &&
             [ -n "$LMU_ANDROID_STORE_PASSWORD" ] &&
             [ -n "$LMU_ANDROID_KEY_ALIAS" ] &&
             [ -n "$LMU_ANDROID_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare owner-controlled Android signing
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true))
        shell: bash
        run: |
          umask 077
          printf '%s' "$LMU_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lmu-upload-key.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/lmu-upload-key.jks
          storePassword=$LMU_ANDROID_STORE_PASSWORD
          keyAlias=$LMU_ANDROID_KEY_ALIAS
          keyPassword=$LMU_ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android release APK and AAB
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify and publish signed APK into web bundle
        id: signed_apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist/downloads
          cp "$APK" dist/downloads/LittleMindsUniverse-1.0.apk
          sha256sum "$APK" | tee dist/downloads/LittleMindsUniverse-1.0.apk.sha256
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed Android release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: littlemindsuniverse-signed-public-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload unsigned release candidate when signing is unavailable
        if: steps.signing.outputs.ready != 'true' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production != true)
        uses: actions/upload-artifact@v7
        with:
          name: littlemindsuniverse-unsigned-release-candidate
          path: |
            android/app/build/outputs/apk/release/*
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Write source-to-artifact provenance manifest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: node scripts/write-build-provenance.mjs dist

      - name: Detect Netlify deployment credentials
        id: netlify
        shell: bash
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Netlify credentials for a main-branch preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ "${{ steps.netlify.outputs.ready }}" != "true" ]; then
            echo "::error::Preview blocked: configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID."
            exit 1
          fi
          if [ "$NETLIFY_SITE_ID" != "989d3b15-5ba4-42f7-8ba6-b53dc64fbd27" ]; then
            echo "::error::Preview blocked: NETLIFY_SITE_ID is not the approved littlemindsuniverse-app site."
            exit 1
          fi

      - name: Deploy release candidate preview to Netlify
        id: netlify_preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          npx --yes netlify-cli@27.12.1 deploy --dir=dist --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json | tee netlify-preview.json

      - name: Smoke-test SHA-bound Netlify preview
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          URL="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('netlify-preview.json','utf8'));console.log(j.url||j.deploy_url||j.ssl_url||'')")"
          test -n "$URL"
          curl --fail --silent --show-error --location "$URL/" > /tmp/lmu-preview-index.html
          grep -qi 'LittleMinds' /tmp/lmu-preview-index.html
          curl --fail --silent --show-error --location "$URL/api/health" > /tmp/lmu-preview-health.json
          cat /tmp/lmu-preview-health.json
          node scripts/verify-deployed-provenance.mjs "$URL"

      # Production is never promoted on a push. A workflow_dispatch run with the
      # explicit boolean confirmation is the owner-controlled release action.
      - name: Enforce production release gate before deploy
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
        shell: bash
        run: |
          if [ "${{ steps.signing.outputs.ready }}" != "true" ]; then
            echo "::error::Release blocked: configure all four owner-controlled Android signing secrets."
            exit 1
          fi
          if [ "${{ steps.signed_apk.outputs.published }}" != "true" ]; then
            echo "::error::Release blocked: signed LMU APK verification/publication did not complete."
            exit 1
          fi
          if [ "${{ steps.netlify.outputs.ready }}" != "true" ]; then
            echo "::error::Release blocked: configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID."
            exit 1
          fi
          node scripts/verify-public-release-inputs.mjs

      - name: Deploy production web app to Netlify
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
        shell: bash
        run: |
          npx --yes netlify-cli@27.12.1 deploy --prod --dir=dist --functions=netlify/functions --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --json | tee netlify-deploy.json

      - name: Smoke-test Netlify production deploy
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
        shell: bash
        run: |
          URL="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('netlify-deploy.json','utf8'));console.log(j.url||j.deploy_url||j.ssl_url||'')")"
          test -n "$URL"
          curl --fail --silent --show-error --location "$URL/" > /tmp/lmu-production-index.html
          grep -qi 'LittleMinds' /tmp/lmu-production-index.html
          curl --fail --silent --show-error --location "$URL/api/health" > /tmp/lmu-production-health.json
          cat /tmp/lmu-production-health.json
          node scripts/verify-deployed-provenance.mjs "$URL"
          npm run verify:play-production -- https://www.littlemindsuniverse.co.za

      - name: Upload Netlify preview evidence
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: netlify-preview-deploy-evidence
          path: |
            netlify-preview.json
            dist/build-info.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload Netlify production deploy evidence
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
        uses: actions/upload-artifact@v7
        with:
          name: netlify-production-deploy-evidence
          path: |
            netlify-deploy.json
            dist/build-info.json
          if-no-files-found: error
          retention-days: 90

      - name: Release-gate summary
        shell: bash
        run: |
          {
            echo "## LMU public release gate"
            echo
            echo "- Source verification and Android build: passed"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Netlify preview credentials available: ${{ steps.netlify.outputs.ready }}"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "- Preview/production deployment: not run for pull_request"
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.confirm_production }}" = "true" ]; then
              echo "- Production promotion: explicitly requested by workflow_dispatch input"
              echo "- Production smoke and provenance verification: required before success"
            else
              echo "- Netlify preview: deployed and smoke-tested"
              echo "- Production promotion: NOT requested; no production deployment performed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

