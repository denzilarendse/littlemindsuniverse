name: materialize-lmu-release

on:
  push:
    branches:
      - release/lmu-20260922
    paths:
      - ".release-bootstrap/**"
      - ".github/workflows/materialize-lmu-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-lmu-release
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lmu-20260922
          fetch-depth: 0

      - name: Reconstruct and verify candidate archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release-bootstrap/part-* | base64 --decode > /tmp/lmu-release.tar.xz
          echo "24aaf1d168ad143224061efd3a3df53477bf8982d3998ab9d3102885b72dc2b1  /tmp/lmu-release.tar.xz" | sha256sum --check
          mkdir -p /tmp/lmu-release-source
          tar -xJf /tmp/lmu-release.tar.xz -C /tmp/lmu-release-source

      - name: Materialize source tree without mutating workflow permissions
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/materialize-lmu-release.yml /tmp/materialize-lmu-release.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/lmu-release-source/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/materialize-lmu-release.yml .github/workflows/materialize-lmu-release.yml
          test -f package.json
          test -f package-lock.json
          test -f netlify.toml
          test -f netlify/functions/health.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify deployable artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          ! find dist -type f | grep -E '\.(before|backup)-'

      - name: Commit verified materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: materialize verified LMU candidate"
          git push origin HEAD:release/lmu-20260922
