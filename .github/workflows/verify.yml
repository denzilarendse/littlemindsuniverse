name: release-verification

on:
  push:
    branches: [main, release/**]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify deployable artifact has no repository backups
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          ! find dist -type f | grep -E '\.(before|backup)-'
