name: apply-secure-messaging-ui

on:
  push:
    branches:
      - fix/secure-messaging-ui-20260923

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/secure-messaging-ui-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare corrected deterministic migration
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('scripts/apply-secure-messaging-ui.mjs')
          text=source.read_text()
          marker='const test=`'
          if marker not in text:
              raise SystemExit('expected temporary test-generation marker not found')
          clean=text.split(marker,1)[0] + "console.log('Applied secure messaging UI hardening.');\n"
          Path('scripts/apply-secure-messaging-ui-run.mjs').write_text(clean)
          PY
      - name: Apply deterministic secure messaging UI
        run: node scripts/apply-secure-messaging-ui-run.mjs
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified messaging UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js tests/messaging-ui.test.mjs dist
          if git diff --cached --quiet; then
            echo "No messaging UI changes to commit"
            exit 0
          fi
          git commit -m "fix: wire secure in-app messaging"
          git push origin HEAD:fix/secure-messaging-ui-20260923
