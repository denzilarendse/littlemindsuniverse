name: teacher-evidence-scan-retention-postgres-runtime

on:
  pull_request:
    paths:
      - 'database/migrations/20261028_teacher_chat_evidence_scan_retention.sql'
      - 'tests/sql/teacher-evidence-scan-retention.integration.sql'
      - 'tests/sql/teacher-evidence-claim-recovery-concurrency.sh'
      - '.github/workflows/teacher-evidence-scan-retention-postgres-runtime.yml'
  push:
    branches: ['test/teacher-evidence-sql-runtime', 'test/teacher-evidence-claim-recovery']
    paths:
      - 'database/migrations/20261028_teacher_chat_evidence_scan_retention.sql'
      - 'tests/sql/teacher-evidence-scan-retention.integration.sql'
      - '.github/workflows/teacher-evidence-scan-retention-postgres-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-retention-postgres-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lmu_scan_retention_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lmu_scan_retention_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lmu_scan_retention_test
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable worker roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN BYPASSRLS"
      - name: Apply exact migration and run worker RPC assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/teacher-evidence-scan-retention.integration.sql
      - name: Exercise concurrent claims and interrupted-worker recovery
        run: bash tests/sql/teacher-evidence-claim-recovery-concurrency.sh
