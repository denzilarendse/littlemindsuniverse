name: caps-resource-discovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/caps-resource-catalogue.json'
      - 'scripts/discover-dbe-caps-resources.mjs'
      - 'api/_lib/milo-document-access.js'
      - 'tests/caps-resource-access.test.mjs'
      - '.github/workflows/caps-resource-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate catalogue JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/caps-resource-catalogue.json','utf8'))"
      - name: Test safe retrieval and link discovery contracts
        run: node --test tests/caps-resource-access.test.mjs
      - name: Discover official DBE resources
        run: node scripts/discover-dbe-caps-resources.mjs
      - name: Upload DBE source discovery report
        uses: actions/upload-artifact@v7
        with:
          name: dbe-caps-resource-discovery
          path: artifacts/dbe-caps-resource-discovery.json
          if-no-files-found: error
          retention-days: 30
