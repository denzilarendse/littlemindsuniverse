name: apply-ux-hardening

on:
  push:
    branches:
      - fix/end-user-friction-20260923

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/end-user-friction-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic UX hardening
        run: node scripts/apply-ux-hardening.mjs
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/app.css index.html scripts/build.mjs tests/ux-hardening.test.mjs dist
          if git diff --cached --quiet; then
            echo "No generated UX hardening changes to commit"
            exit 0
          fi
          git commit -m "fix: harden end-user dashboard interactions"
          git push origin HEAD:fix/end-user-friction-20260923
