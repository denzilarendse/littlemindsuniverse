name: android-bootstrap

on:
  push:
    branches:
      - feat/android-api36-capacitor8-20260926

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Capacitor 8 toolchain
        run: npm install --ignore-scripts

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build production web bundle
        run: npm run build

      - name: Generate Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi

      - name: Verify frozen application ID and API 36
        run: |
          test -f android/app/build.gradle
          test -f android/variables.gradle
          grep -F 'applicationId "za.co.littlemindsuniverse"' android/app/build.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle

      - name: Build unsigned release AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Android release candidate
        uses: actions/upload-artifact@v4
        with:
          name: littlemindsuniverse-android-api36-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit generated Android project and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then
            echo "No generated Android changes to commit."
          else
            git commit -m "build: generate Capacitor 8 Android API 36 project"
            git push origin HEAD:feat/android-api36-capacitor8-20260926
          fi
