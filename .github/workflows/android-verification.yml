name: android-verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'connect.html'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'capacitor.connect.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-verification.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'connect.html'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'capacitor.connect.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit shipped runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify web source before native packaging
        run: npm run check

      - name: Sync production web bundle into LMU Android
        run: npm run android:sync

      - name: Prepare standalone Connect Android payload
        run: npm run android:connect:sync

      - name: Verify frozen identities, SDK levels and child-safe native defaults
        run: |
          grep -F '"appId": "za.co.littlemindsuniverse"' capacitor.config.json
          grep -F 'applicationId "za.co.littlemindsuniverse"' android/app/build.gradle
          grep -F '"appId": "za.co.littlemindsuniverse.connect"' capacitor.connect.config.json
          grep -F '"appName": "LittleMinds Connect"' capacitor.connect.config.json
          grep -F 'applicationId "za.co.littlemindsuniverse.connect"' android/connectapp/build.gradle
          grep -F 'namespace = "za.co.littlemindsuniverse.connect"' android/connectapp/build.gradle
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24' android/variables.gradle
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:allowBackup="false"' android/connectapp/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/connectapp/src/main/AndroidManifest.xml
          test "$(grep -c '<uses-permission ' android/app/src/main/AndroidManifest.xml)" -eq 1
          test "$(grep -c '<uses-permission ' android/connectapp/src/main/AndroidManifest.xml)" -eq 1
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' android/connectapp/src/main/AndroidManifest.xml
          ! grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS)' android/app/src/main/AndroidManifest.xml
          ! grep -Eq 'android.permission.(CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|READ_CONTACTS|WRITE_CONTACTS)' android/connectapp/src/main/AndroidManifest.xml
          test -f android/connectapp/src/main/assets/public/index.html
          grep -F 'LittleMinds Connect' android/connectapp/src/main/assets/public/index.html
          ! grep -F 'id="app"' android/connectapp/src/main/assets/public/index.html
          ! grep -R 'com\.getcapacitor\.app\|com\.getcapacitor\.myapp' android/app/src/test android/app/src/androidTest android/connectapp/src 2>/dev/null

      - name: Android lint, unit and instrumentation compile verification
        run: |
          cd android
          ./gradlew :app:lintRelease :app:testReleaseUnitTest :app:assembleDebugAndroidTest \
            :connectapp:lintRelease :connectapp:testReleaseUnitTest :connectapp:assembleDebugAndroidTest

      - name: Build API 36 release bundles, LMU pilot APK and Connect APK
        run: |
          cd android
          ./gradlew :app:bundleRelease :app:assembleDebug :connectapp:bundleRelease :connectapp:assembleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | tee /tmp/lmu-jarsigner.txt
          grep -F 'jar is unsigned.' /tmp/lmu-jarsigner.txt
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          jarsigner -verify connectapp/build/outputs/bundle/release/connectapp-release.aab 2>&1 | tee /tmp/connect-jarsigner.txt
          grep -F 'jar is unsigned.' /tmp/connect-jarsigner.txt
          test -s connectapp/build/outputs/apk/release/connectapp-release-unsigned.apk
          sha256sum connectapp/build/outputs/apk/release/connectapp-release-unsigned.apk

      - name: Upload LMU installable pilot debug APK
        uses: actions/upload-artifact@v7
        with:
          name: littlemindsuniverse-pilot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload LMU unsigned release-candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: littlemindsuniverse-android-api36-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Connect unsigned release-candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: littleminds-connect-android-api36-unsigned
          path: android/connectapp/build/outputs/bundle/release/connectapp-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Connect unsigned APK for owner signing
        uses: actions/upload-artifact@v7
        with:
          name: littleminds-connect-android-api36-unsigned-apk
          path: android/connectapp/build/outputs/apk/release/connectapp-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30


  verify-emulator:
    needs: verify-android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Sync verified web bundle into Android
        run: npm run android:sync

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute LMU on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_7
          working-directory: ./android
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop za.co.littlemindsuniverse
            adb shell am start -W -n za.co.littlemindsuniverse/.MainActivity | tee /tmp/lmu-launch.txt
            grep -F 'Status: ok' /tmp/lmu-launch.txt
            adb shell pidof za.co.littlemindsuniverse
