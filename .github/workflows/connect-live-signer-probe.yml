name: connect-live-signer-probe

on:
  push:
    branches:
      - release/verify-connect-download

permissions:
  contents: read

jobs:
  verify-live-signer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download live Connect APK
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            https://www.littlemindsuniverse.co.za/downloads/LittleMinds-Connect-1.0.0.apk \
            -o /tmp/LittleMinds-Connect-1.0.0.apk
          test "$(stat -c '%s' /tmp/LittleMinds-Connect-1.0.0.apk)" -eq 3024688
          echo '65c8ae9335304601fe2098684e08dfe9bfcca7cebdb11fbc9de093d9e73412cb  /tmp/LittleMinds-Connect-1.0.0.apk' | sha256sum -c -

      - name: Verify APK signature and owner certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs /tmp/LittleMinds-Connect-1.0.0.apk | tee /tmp/apksigner.txt
          grep -F 'Verifies' /tmp/apksigner.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner.txt
          grep -F 'Number of signers: 1' /tmp/apksigner.txt
          grep -Fi 'certificate SHA-256 digest: e9bb1e0782aa8b19550e742fe2f59c49a0345afdd65447ce23734c64344525d5' /tmp/apksigner.txt
          grep -Fi 'key algorithm: RSA' /tmp/apksigner.txt
          grep -Fi 'key size (bits): 4096' /tmp/apksigner.txt
