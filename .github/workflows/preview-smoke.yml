name: preview-runtime-smoke

on:
  push:
    branches: [release/lmu-20260922-source]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://littlemindsuniverse-git-release-6d3bee-denzilarendses-projects.vercel.app
    steps:
      - name: Verify preview HTTPS and root application
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 36); do
            code=$(curl -sS --max-time 12 -o /tmp/lmu-root.html -w '%{http_code}' "$BASE_URL/" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
          grep -q '<title>LittleMindsUniverse</title>' /tmp/lmu-root.html
          curl -fsSI --max-time 12 "$BASE_URL/" >/tmp/lmu-root-headers.txt

      - name: Verify deployed backend health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BASE_URL/api/health" -o /tmp/lmu-health.json
          node - <<'NODE'
          const fs = require('node:fs');
          const h = JSON.parse(fs.readFileSync('/tmp/lmu-health.json', 'utf8'));
          if (h.ok !== true || h.service !== 'littlemindsuniverse') process.exit(1);
          console.log(JSON.stringify({
            ok: h.ok,
            service: h.service,
            miloConfigured: Boolean(h.miloConfigured),
            whatsappConfigured: Boolean(h.whatsappConfigured),
            payfastConfigured: Boolean(h.payfastConfigured)
          }));
          NODE
