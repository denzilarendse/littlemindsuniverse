name: apply-onboarding-hardening

on:
  push:
    branches:
      - fix/onboarding-family-ux-20260923

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-family-ux-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic onboarding hardening
        run: node scripts/apply-onboarding-hardening.mjs
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified onboarding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app.js assets/app.css index.html scripts tests dist
          if git diff --cached --quiet; then
            echo "No onboarding changes to commit"
            exit 0
          fi
          git commit -m "fix: harden family onboarding and account UX"
          git push origin HEAD:fix/onboarding-family-ux-20260923
