name: production-domain-probe

on:
  push:
    branches:
      - probe/production-domain-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify production domain, TLS, shells, headers, PWA boundary and server readiness
        run: npm run verify:production -- https://www.littlemindsuniverse.co.za
