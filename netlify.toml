[build]
  functions = "api"
  publish = "dist"

[functions]
  directory = "api"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=15552000"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://zcokxljcsfkrlouzragv.supabase.co; media-src 'self' blob: https://zcokxljcsfkrlouzragv.supabase.co; font-src 'self' data:; connect-src 'self' https://zcokxljcsfkrlouzragv.supabase.co wss://zcokxljcsfkrlouzragv.supabase.co; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za; upgrade-insecure-requests"

[dev]
  functions = "api"
  publish = "dist"

[context.deploy-preview]
  command = "npm run build"
  functions = "netlify/disabled-functions"
  publish = "dist"

[context.deploy-preview.environment]
  SUPABASE_URL = ""
  SUPABASE_PUBLISHABLE_KEY = ""
  SUPABASE_ANON_KEY = ""
  SUPABASE_SECRET_KEY = ""
  SUPABASE_SERVICE_ROLE_KEY = ""
  GROQ_API_KEY = ""
  PAYFAST_MERCHANT_ID = ""
  PAYFAST_MERCHANT_KEY = ""
